<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nosi Tempo</title>
  <meta name="description" content="Задачі й облік часу в одному місці, прямо в Telegram.">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="top">
    <div class="top__row">
      <a class="mark" href="#tasks/today" aria-label="Nosi Tempo, до задач">Nosi Tempo</a>
      <span class="top__date" id="top-date"></span>
    </div>
    <nav class="tabs" aria-label="Розділи">
      <a class="tab" href="#tasks/today" data-tab="tasks">Задачі</a>
      <a class="tab" href="#timer" data-tab="timer">Час</a>
      <a class="tab" href="#report/week" data-tab="report">Звіт</a>
      <a class="tab" href="#ai" data-tab="ai">Асистент</a>
    </nav>
  </header>

  <section class="clock" id="clock" aria-live="polite" hidden>
    <div class="clock__what">
      <p class="clock__title" id="clock-title"></p>
      <p class="clock__meta" id="clock-meta"></p>
    </div>
    <p class="clock__time measure" id="clock-time">0:00:00</p>
    <button class="btn btn--primary clock__stop" type="button" id="clock-stop">Стоп</button>
  </section>

  <main class="main" id="main">
    <noscript>
      <div class="state">
        <h1>Nosi Tempo</h1>
        <p>Цей застосунок працює всередині Telegram. Відкрий його кнопкою в чаті з ботом.</p>
      </div>
    </noscript>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button class="toast__undo" type="button" id="toast-undo" hidden>Повернути</button>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
